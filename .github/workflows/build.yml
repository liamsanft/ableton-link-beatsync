# Builds standalone executables (no Python needed on the target machine).
# Run manually (Actions tab) to get artifacts, or push a tag like v1.0 to publish them as a release.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,      name: link-beat-sync-macos-arm64, sep: ":" }
          - { os: macos-15-intel, name: link-beat-sync-macos-x64,   sep: ":" }
          - { os: windows-latest, name: link-beat-sync-windows.exe, sep: ";" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s test
      - run: >
          python -m PyInstaller --onefile --name "${{ matrix.name }}"
          --add-data "static${{ matrix.sep }}static" --collect-all aalink server.py
      - name: Smoke test (server starts and answers)
        shell: bash
        run: |
          EXE="dist/${{ matrix.name }}"
          "$EXE" & PID=$!
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/ >/dev/null && ok=1 && break; sleep 1; done
          kill $PID || true
          [ "${ok:-}" = 1 ]
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "dist/${{ matrix.name }}" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
